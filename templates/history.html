<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - Wello Internal Tooling</title>
    <meta name="description" content="View your outreach generation history">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
    <!-- Modern Header -->
    <header class="header">
        <div class="header-content">
            <div class="header-left">
                <div class="logo-section">
                    <img src="{{ url_for('logo') }}" alt="Westbridge" class="logo">
                    <div class="branding">
                        <div class="brand-name">Wello</div>
                        <div class="brand-subtitle">Generation History</div>
                    </div>
                </div>
            </div>
            
            <div class="auth-section">
                <div class="user-dropdown" id="userDropdown">
                    <button class="user-dropdown-btn" id="userDropdownBtn">
                        <span class="user-avatar"></span>
                        <span class="user-name" id="userName">{{ user.name if user else 'Loading...' }}</span>
                        <span class="dropdown-arrow">▼</span>
                    </button>
                    <div class="user-dropdown-menu" id="userDropdownMenu">
                        <a href="/" class="dropdown-item">
                            <span class="dropdown-icon">
                                <svg class="icon" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                                </svg>
                            </span>
                            Home
                        </a>
                        <a href="/analytics" class="dropdown-item">
                            <span class="dropdown-icon">
                                <svg class="icon" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" />
                                </svg>
                            </span>
                            Analytics
                        </a>
                        <a href="/history" class="dropdown-item active">
                            <span class="dropdown-icon">
                                <svg class="icon" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                                </svg>
                            </span>
                            History
                        </a>
                        <hr class="dropdown-divider">
                        <a href="/logout" class="dropdown-item logout">
                            <span class="dropdown-icon">
                                <svg class="icon" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
                                </svg>
                            </span>
                            Logout
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="history-layout">
        <div class="history-container">
            <div class="history-header">
                <!-- Navigation Section -->
                <div class="history-nav-section">
                    <a href="/" class="back-link">
                        <span class="back-arrow">←</span>
                        Back to Home
                    </a>
                </div>
                
                <!-- Title Section -->
                <div class="history-title-section">
                    <h1 class="history-title">Generation History</h1>
                    <p class="history-subtitle">View and manage your past outreach generations</p>
                </div>
                
                <!-- Controls Section -->
                <div class="history-controls-section">
                    <!-- Search -->
                    <div class="history-search-wrapper">
                        <div class="search-input-container">
                            <svg class="search-icon" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                            </svg>
                            <input type="text" id="historyPageSearch" placeholder="Search history..." class="search-input">
                        </div>
                    </div>
                    
                    <!-- Filters -->
                    <div class="history-filters-wrapper">
                        <div class="filters-label">
                            <span>Filter by:</span>
                        </div>
                        <div class="history-filters">
                            <div class="filter-group">
                                <label class="filter-label">PROJECT:</label>
                                <select id="projectFilter" class="filter-select">
                                    <option value="all">All Projects</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label class="filter-label">TYPE:</label>
                                <select id="typeFilter" class="filter-select">
                                    <option value="all">All Types</option>
                                    <option value="founder">Founder Outreach</option>
                                    <option value="investor">Investor Research</option>
                                    <option value="any">General Outreach</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label class="filter-label">STATUS:</label>
                                <select id="statusFilter" class="filter-select">
                                    <option value="all">All Status</option>
                                    <option value="completed">Completed</option>
                                    <option value="failed">Failed</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- History List -->
            <div class="history-list-container">
                <div class="history-list" id="historyList">
                    <div class="history-loading">
                        <div class="loading-spinner"></div>
                        <p>Loading your generation history...</p>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="history-actions">
                <a href="/" class="action-btn primary">
                    <div class="btn-content">
                        <div class="btn-title">New Generation</div>
                        <div class="btn-subtitle">Create new outreach</div>
                    </div>
                </a>
                <a href="/analytics" class="action-btn secondary">
                    <div class="btn-content">
                        <div class="btn-title">View Analytics</div>
                        <div class="btn-subtitle">Performance insights</div>
                    </div>
                </a>
            </div>
        </div>
    </main>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/history.js') }}"></script>
</body>
</html>
